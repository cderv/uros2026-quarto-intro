project:
  output-dir: _output

format:
  html:
    theme: [brand, brand/captions.scss]
    toc: false
    embed-resources: false
  typst:
    knitr:
      opts_chunk:
        dev: svglite
    include-in-header: brand/captions.typ
    papersize: a4
    pdf-standard: [ua-1]
    logo:
      width: 1.4cm
      location: right-top
      padding: 1.2cm
    margin:
      x: 2cm
      y: 2cm
  docx: default

fig-cap-location: top
tbl-cap-location: top

knitr:
  opts_chunk:
    dev: ragg_png

execute:
  echo: false
  warning: false
  message: false
