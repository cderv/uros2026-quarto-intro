<script type="text/javascript">
  // Hide the logo on the title slide only. No-op when the deck has no logo.
  function toggleLogo(indexh) {
    var logo = document.querySelector("div.has-logo > img.slide-logo");
    if (!logo) return;
    logo.style.display = indexh === 0 ? "none" : null;
  }
  Reveal.on('ready', (event) => {
    toggleLogo(event.indexh);
    // In an r-vstack made only of image paragraphs, lift the images out of
    // their <p> so the stack sizes them.
    var slides = Reveal.getSlidesElement();
    slides.querySelectorAll('div.r-vstack').forEach((vstack) => {
      var isAllP = Array.from(vstack.children).every((child) => child.tagName === 'P');
      var isAllImg = Array.from(vstack.children).every((child) => Array.from(child.children).every((child) => child.tagName === 'IMG'));
      if (isAllP && isAllImg) {
        Array.from(vstack.children).forEach((child) => {
          Array.from(child.children).forEach((img) => {
            vstack.appendChild(img);
          });
          vstack.removeChild(child);
        });
      }
    });
  });
  Reveal.on('slidechanged', (event) => {
    toggleLogo(event.indexh);
  });
</script>

<script type="text/javascript">
  // Z gallery: easycarousel autoplays from page load and loops. Restart it from
  // the first thumbnail when its slide is shown, stop it on the last thumbnail,
  // and pause it when the slide is left (the extension itself is not edited).
  (function () {
    function carousels() {
      return Array.from(document.querySelectorAll('.easycarousel'))
        .filter((el) => el.easycarousel && el.easycarousel.plugins().autoplay);
    }
    function stopOnLast(embla) {
      // timerset fires just before the plugin marks itself as playing: defer
      if (embla.selectedScrollSnap() === embla.scrollSnapList().length - 1) {
        setTimeout(() => embla.plugins().autoplay.stop(), 0);
      }
    }
    function sync(slide) {
      carousels().forEach((el) => {
        var embla = el.easycarousel;
        if (slide && slide.contains(el)) {
          // measured while hidden, Embla saw a single snap and autoplay never
          // initialised: re-initialise now that the slide is laid out
          embla.reInit();
          embla.off('autoplay:timerset', stopOnLast).on('autoplay:timerset', stopOnLast);
          embla.scrollTo(0, true);
          embla.plugins().autoplay.play();
        } else {
          embla.plugins().autoplay.stop();
        }
      });
    }
    Reveal.on('ready', () => setTimeout(() => sync(Reveal.getCurrentSlide()), 300));
    Reveal.on('slidechanged', (e) => sync(e.currentSlide));
  })();
</script>
